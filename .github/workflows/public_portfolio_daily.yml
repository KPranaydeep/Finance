name: Public portfolio daily trust update

on:
  schedule:
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-portfolio-database-writer
  cancel-in-progress: false

jobs:
  forecast-accountability:
    runs-on: ubuntu-latest
    environment: PRODUCTION
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Check review-policy maintenance horizon
        run: python check_public_review_maintenance.py
      - run: pip install -r requirements.txt
      - run: python update_public_nav.py
        env:
          PUBLIC_BASKET_DATABASE_URL: ${{ secrets.PUBLIC_BASKET_DATABASE_URL }}
          PUBLIC_PORTFOLIO_ENV: PRODUCTION
          PUBLIC_BASKET_ID: PUBLIC-01
          PUBLIC_PORTFOLIO_TIMEZONE: Asia/Kolkata
          PUBLIC_PERFORMANCE_VERSION: performance-v1
          PUBLIC_FORECAST_VERSION: forecast-v3-28calendar
          PUBLIC_FORECAST_METHOD: historical-calendar-block-28d-v1
          PUBLIC_CACHE_TTL_SECONDS: "300"
          PUBLIC_REFRESH_POLICY: weekdays-after-market-close
          PUBLIC_MODEL_BACKFILL_TRADING_DAYS: ${{ vars.PUBLIC_MODEL_BACKFILL_TRADING_DAYS || '0' }}
      - run: python update_public_forecasts.py
        env:
          PUBLIC_BASKET_DATABASE_URL: ${{ secrets.PUBLIC_BASKET_DATABASE_URL }}
          PUBLIC_PORTFOLIO_ENV: PRODUCTION
          PUBLIC_BASKET_ID: PUBLIC-01
          PUBLIC_PORTFOLIO_TIMEZONE: Asia/Kolkata
          PUBLIC_PERFORMANCE_VERSION: performance-v1
          PUBLIC_FORECAST_VERSION: forecast-v3-28calendar
          PUBLIC_FORECAST_METHOD: historical-calendar-block-28d-v1
          PUBLIC_CACHE_TTL_SECONDS: "300"
          PUBLIC_REFRESH_POLICY: weekdays-after-market-close
          PUBLIC_MODEL_BACKFILL_TRADING_DAYS: ${{ vars.PUBLIC_MODEL_BACKFILL_TRADING_DAYS || '0' }}
      - name: Verify production trust layer
        run: python production_smoke_test.py
        env:
          PUBLIC_BASKET_DATABASE_URL: ${{ secrets.PUBLIC_BASKET_DATABASE_URL }}
          PUBLIC_PORTFOLIO_ENV: PRODUCTION
          PUBLIC_BASKET_ID: PUBLIC-01
          PUBLIC_PORTFOLIO_TIMEZONE: Asia/Kolkata
          PUBLIC_PERFORMANCE_VERSION: performance-v1
          PUBLIC_FORECAST_VERSION: forecast-v3-28calendar
          PUBLIC_FORECAST_METHOD: historical-calendar-block-28d-v1
          PUBLIC_CACHE_TTL_SECONDS: "300"
          PUBLIC_REFRESH_POLICY: weekdays-after-market-close
          PUBLIC_MODEL_BACKFILL_TRADING_DAYS: ${{ vars.PUBLIC_MODEL_BACKFILL_TRADING_DAYS || '0' }}
      - name: Export verified public snapshot
        run: python export_public_record_snapshot.py
        env:
          PUBLIC_BASKET_DATABASE_URL: ${{ secrets.PUBLIC_BASKET_DATABASE_URL }}
      - name: Publish quota-free public snapshot
        run: bash scripts/publish_public_snapshot.sh public_record_snapshot.json
