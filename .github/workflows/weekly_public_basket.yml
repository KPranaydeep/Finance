name: Public basket publisher retired

# The scheduled weekly publisher was permanently retired when the public basket
# moved to the event-driven PostgreSQL ledger. This workflow has no schedule,
# receives no database secret, and cannot run the optimizer or write ledger data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Confirm publisher is retired
    runs-on: ubuntu-latest
    steps:
      - name: Retirement notice
        run: |
          echo "The weekly public-basket publisher is retired."
          echo "No signal, rebalance, order, execution, cash, position, or NAV record was created."

