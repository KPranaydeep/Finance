name: Public basket weekly signal

on:
  schedule:
    # Runs every weekday at 10:00 IST (04:30 UTC), after market open.
    # run_weekly_signal.py is a no-op except on the actual first open
    # session of the week, so running it daily is intentional and safe.
    - cron: "30 4 * * 1-5"
  workflow_dispatch: {}

jobs:
  run-weekly-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # TODO: replace this step with whatever actually generates today's
      # live portfolio snapshot (holdings, prices, FX) as JSON -- the
      # adapter deliberately does NOT fetch live data itself, it only
      # reads a pre-built "frozen" input file. A static secret works for
      # testing but will go stale for real weekly use; wire this up to
      # your actual portfolio source before relying on it in production.
      - name: Write today's frozen input
        env:
          PUBLIC_BASKET_INPUT_JSON: ${{ secrets.PUBLIC_BASKET_INPUT_JSON }}
        run: echo "$PUBLIC_BASKET_INPUT_JSON" > today_input.json

      - name: Run weekly signal
        env:
          PUBLIC_BASKET_DATABASE_URL: ${{ secrets.PUBLIC_BASKET_DATABASE_URL }}
          PUBLIC_BASKET_INPUT_PATH: ${{ github.workspace }}/today_input.json
        run: python run_weekly_signal.py
